name: Security audit

# Auditoría de dependencias: se ejecuta en cada PR (para no meter CVEs
# nuevas) y semanalmente los lunes (para pillar CVEs publicadas después de
# hacer merge). Falla si aparecen vulnerabilidades HIGH o CRITICAL.
#
# P0.15: acciones pineadas por SHA (no por tag) para evitar que una acción
# comprometida en su release publique código nuevo bajo la misma etiqueta
# y lo ejecutemos con permisos del repo. Los SHAs corresponden a las
# versiones marcadas en el comentario y se actualizan con Dependabot.
#
# Permisos por defecto restringidos al mínimo (read-all) — cada job pide
# más si lo necesita. Nunca permitir write por defecto.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # cada lunes a las 06:00 UTC
  workflow_dispatch: # también manual desde la UI de Actions

permissions: read-all

jobs:
  npm-audit:
    name: npm audit (high+ severity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit (high severity or above)
        run: npm audit --audit-level=high
